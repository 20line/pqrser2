name: fundarb tests

on:
  push:
    branches: [main]
    paths:
      - "fundarb/**"
      - ".github/workflows/fundarb-tests.yml"
  pull_request:
    paths:
      - "fundarb/**"
      - ".github/workflows/fundarb-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fundarb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fundarb with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: pip install pyflakes && python -m pyflakes src tests

      - name: Run tests
        run: pytest -q
